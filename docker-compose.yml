services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fridge
      POSTGRES_PASSWORD: fridge
      POSTGRES_DB: fridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridge -d fridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: development
      additional_contexts:
        recipe_seed: ./recipe_data/image-seed
    env_file:
      - path: .env
        required: false # .env가 없으면 기본값으로 뜬다
    environment:
      # 컨테이너 안에서는 항상 compose의 db 서비스와 볼륨 경로를 쓴다
      DATABASE_URL: postgresql+psycopg://fridge:fridge@db:5432/fridge
      UPLOAD_DIR: /app/uploads
      RECIPE_DATA_DIR: /app/recipe_data
      RECOMMENDATION_MODEL_DIR: /opt/recommendation-model
      # 영수증 사진은 ocr 서비스가 읽는다 (아래). API 컨테이너는 OCR 모델을 올리지 않는다
      OCR_ENGINE: remote
      OCR_SERVICE_URL: http://ocr:8001
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - recipe_data:/app/recipe_data
      - ./recipe_data/recommendation-seed:/opt/recommendation-model:ro

  # OCR server (app/ocr_server.py): reads receipt photos for the api service. Not published to the host.
  ocr:
    build:
      context: .
      target: development
      additional_contexts:
        recipe_seed: ./recipe_data/image-seed
    entrypoint: []  # no recipe data or database here
    command: ["uvicorn", "app.ocr_server:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    env_file:
      - path: .env
        required: false
    environment:
      OCR_ENGINE: paddle
    volumes:
      # PaddleOCR 모델 캐시: 재시작할 때 다시 내려받지 않는다
      - paddle_models:/root/.paddlex

volumes:
  pgdata:
  uploads:
  recipe_data:
  paddle_models:
