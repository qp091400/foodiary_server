services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fridge
      POSTGRES_PASSWORD: fridge
      POSTGRES_DB: fridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridge -d fridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false # .env가 없으면 기본값으로 뜬다
    environment:
      # 컨테이너 안에서는 항상 compose의 db 서비스와 볼륨 경로를 쓴다
      DATABASE_URL: postgresql+psycopg://fridge:fridge@db:5432/fridge
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      # PaddleOCR 모델 캐시: 재시작할 때 다시 내려받지 않는다
      - paddle_models:/root/.paddlex

volumes:
  pgdata:
  uploads:
  paddle_models:
