<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영수증 인식 테스트</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --card: #ffffff; --text: #1c1e21; --muted: #667085; --line: #e4e7ec;
    --accent: #2563eb; --warn-bg: #fff4e5; --warn: #b54708; --err-bg: #fef1f1; --err: #b42318; --dim: #98a2b3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317; --card: #1a1e24; --text: #e7e9ec; --muted: #98a2b3; --line: #2b313a;
      --accent: #6aa5ff; --warn-bg: #3a2a14; --warn: #fdb974; --err-bg: #3a1a1a; --err: #fda29b; --dim: #667085;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .lead { margin: 0 0 20px; color: var(--muted); }
  .wake { margin: -12px 0 16px; color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .drop {
    display: block; text-align: center; padding: 28px 16px; cursor: pointer;
    border: 2px dashed var(--line); border-radius: 12px; background: var(--card);
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop strong { display: block; font-size: 16px; }
  .drop span { color: var(--muted); font-size: 13px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop:focus-within { border-color: var(--accent); }
  .pick { display: grid; gap: 12px; }
  .password { display: grid; gap: 6px; margin-bottom: 12px; }
  .password label { font-weight: 600; }
  .password input {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); width: 100%; max-width: 360px;
  }
  .password span { color: var(--muted); font-size: 13px; }
  /* "사진 찍기"는 손가락으로 쓰는 기기(휴대폰·태블릿)에서만 보인다 */
  .camera, .for-touch { display: none; }
  @media (pointer: coarse) {
    .camera { display: block; border-style: solid; border-color: var(--accent); }
    .camera strong { color: var(--accent); }
    .for-mouse { display: none; }
    .for-touch { display: inline; }
  }
  .status { margin: 16px 0 0; color: var(--muted); }
  .note { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; }
  .note.warn { background: var(--warn-bg); color: var(--warn); }
  .note.error { background: var(--err-bg); color: var(--err); }
  .tabs { margin-top: 16px; }
  .batch-info { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  .tab-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tab {
    font: inherit; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
    background: var(--card); color: var(--text);
  }
  .tab[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tab.failed { color: var(--err); }
  .layout { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .layout > section, .results > section { min-width: 0; }
  .results { display: grid; gap: 16px; }
  #preview { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; border-radius: 8px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .fact span { display: block; font-size: 12px; color: var(--muted); }
  .fact strong { font-size: 16px; word-break: break-all; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  td.name { white-space: normal; min-width: 140px; }
  tr.excluded td { color: var(--dim); }
  .low { color: var(--warn); font-weight: 600; }
  .sub { display: block; font-size: 12px; color: var(--muted); }
  ol.lines { margin: 0; padding-left: 28px; font: 13px/1.6 ui-monospace, Consolas, "D2Coding", monospace; overflow-x: auto; }
  ol.lines li { white-space: pre; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { margin: 10px 0 0; overflow-x: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>영수증 인식 테스트</h1>
  <p class="lead">사진을 올리면 실제 업로드와 같은 방식으로 인식한 결과를 보여 줍니다. 여기서 올린 것은 저장되지 않습니다.</p>
  <p class="wake" id="wake" hidden></p>

  <div class="card password" id="passwordBox" hidden>
    <label for="password">테스트 비밀번호</label>
    <input type="password" id="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    <span>맞는 비밀번호는 이 기기에 기억해 둡니다.</span>
  </div>

  <div class="pick">
    <label class="drop camera">
      <input type="file" id="camera" accept="image/*" capture="environment">
      <strong>사진 찍기</strong>
      <span>카메라로 영수증을 바로 찍어 올립니다</span>
    </label>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" multiple>
      <strong>영수증 사진 선택 (여러 장 가능)</strong>
      <span class="for-mouse">눌러서 고르거나 여기로 끌어다 놓으세요. 여러 장도 한 번에</span>
      <span class="for-touch">앨범에 있는 사진을 고릅니다. 여러 장도 한 번에</span>
    </label>
  </div>

  <p class="status" id="status" hidden></p>
  <p class="note error" id="error" hidden></p>

  <div class="tabs" id="tabs" hidden>
    <p class="batch-info" id="batchInfo"></p>
    <div class="tab-row" id="tabRow" role="tablist"></div>
  </div>

  <div class="layout" id="layout" hidden>
    <section class="card">
      <h2>올린 사진</h2>
      <img id="preview" alt="올린 영수증 사진">
    </section>

    <div class="results" id="result" hidden>
      <section class="card">
        <h2>영수증 정보</h2>
        <div class="facts" id="facts"></div>
        <div id="notes"></div>
      </section>

      <section class="card">
        <h2>읽어낸 품목 <span id="itemCount"></span></h2>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>#</th><th>품목</th><th>용량</th><th class="num">수량</th><th class="num">단가</th><th class="num">금액</th>
                <th class="num">할인</th><th>카테고리</th><th>예상 소비기한</th><th>냉장고</th><th class="num">인식률</th>
              </tr>
            </thead>
            <tbody id="items"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>OCR이 읽은 원문 줄</h2>
        <ol class="lines" id="lines"></ol>
      </section>

      <section class="card">
        <details>
          <summary>응답 JSON 보기</summary>
          <pre id="json"></pre>
        </details>
      </section>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const SOURCE = { barcode: "바코드 조회", category: "카테고리 추정", manual: "직접 입력" };
const STORAGE = { fridge: "냉장", freezer: "냉동", room: "실온" };

const won = (value) => (value == null ? "-" : value.toLocaleString("ko-KR") + "원");

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (className) node.className = className;
  return node;
}

const MAX_SIDE = 2000; // 서버도 긴 변 2000px로 줄여서 인식한다
const EXTENSIONS = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };
const inputs = [$("file"), $("camera")];

// 같은 페이지를 두 주소에서 쓴다: /dev/receipt-test(개발, 비밀번호 없음)와 /receipt-test(운영, 테스트 비밀번호)
const ENDPOINT = location.pathname.startsWith("/dev/") ? "/dev/receipt-test" : "/receipt-test";
const NEEDS_PASSWORD = ENDPOINT === "/receipt-test";
const PASSWORD_KEY = "receipt-test-password";

function remember(password) {
  try {
    if (password) localStorage.setItem(PASSWORD_KEY, password);
    else localStorage.removeItem(PASSWORD_KEY);
  } catch (error) {
    // 저장소를 못 쓰는 브라우저면 매번 입력한다
  }
}

if (NEEDS_PASSWORD) {
  $("passwordBox").hidden = false;
  try {
    $("password").value = localStorage.getItem(PASSWORD_KEY) || "";
  } catch (error) {
    // 위와 같다
  }
}

// 페이지를 열자마자 서버를 깨운다. 서버가 쉬고 있었으면 영수증을 찍는 동안 준비된다.
const wakeStarted = Date.now();
$("wake").textContent = "서버 준비 중…";
$("wake").hidden = false;
fetch("/health", { cache: "no-store" })
  .then((response) => {
    const seconds = Math.round((Date.now() - wakeStarted) / 1000);
    $("wake").textContent = !response.ok ? "서버 상태를 확인하지 못했습니다."
      : seconds >= 3 ? `서버 준비됨 (쉬고 있던 서버를 깨우는 데 ${seconds}초 걸렸습니다)` : "서버 준비됨";
  })
  .catch(() => {
    $("wake").textContent = "서버에 연결할 수 없습니다.";
  });

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = URL.createObjectURL(file);
  });
}

// 휴대폰 사진은 크다(수 MB 이상). 서버가 어차피 긴 변 2000px로 줄이므로 미리 줄여서 JPEG로 보낸다.
// 이미 작고 서버가 받는 형식이면 원본 그대로, 브라우저가 못 여는 형식이어도 원본 그대로 보낸다.
async function shrink(file) {
  const extension = EXTENSIONS[file.type];
  const original = { data: file, name: extension ? "receipt." + extension : file.name };
  try {
    const image = await loadImage(file);
    const scale = Math.min(1, MAX_SIDE / Math.max(image.naturalWidth, image.naturalHeight));
    if (scale === 1 && extension) return original;
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(image.naturalWidth * scale);
    canvas.height = Math.round(image.naturalHeight * scale);
    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
    return blob ? { data: blob, name: "receipt.jpg" } : original;
  } catch (error) {
    return original;
  }
}

function showError(message) {
  $("error").textContent = message;
  $("error").hidden = false;
}

function timingFacts(data) {
  const server = ["서버 처리", `${data.server_seconds}초 (그중 OCR ${data.ocr_seconds}초)`];
  // 여러 장이면 전체 시간은 위의 안내에 한 번만 보여 주고, 장마다 서버 처리 시간만 보여 준다.
  if (data.total_seconds == null) return [server];
  // 전체 = 사진 준비·올리기·서버 대기 + 서버 처리. 서버 처리 중 대부분이 OCR이다.
  return [
    ["전체 걸린 시간", data.total_seconds + "초"],
    server,
    ["올리기·대기", Math.max(0, data.total_seconds - data.server_seconds).toFixed(1) + "초"],
  ];
}

function render(data) {
  const facts = [
    ["매장", data.store_name || "못 읽음"],
    ["구매일", data.purchased_on || "못 읽음"],
    ["영수증 총액", data.total_amount == null ? "못 읽음" : won(data.total_amount)],
    ["품목 합계", won(data.items_sum)],
    ["영수증 바코드", data.receipt_barcode || "없음"],
    ...timingFacts(data),
  ];
  $("facts").replaceChildren(
    ...facts.map(([label, value]) => {
      const box = el("div", null, "fact");
      box.append(el("span", label), el("strong", value));
      return box;
    })
  );

  const notes = [];
  if (data.ocr_error) notes.push(el("p", "OCR 실패: " + data.ocr_error, "note error"));
  for (const warning of data.warnings) notes.push(el("p", warning, "note warn"));
  $("notes").replaceChildren(...notes);

  $("itemCount").textContent = data.draft_items.length + "개";
  $("items").replaceChildren(
    ...data.draft_items.map((item) => {
      const row = el("tr", null, item.include ? "" : "excluded");
      const name = el("td", item.name, "name");
      if (item.product_name) name.append(el("span", "제품: " + item.product_name, "sub"));
      if (item.barcode) name.append(el("span", "상품코드: " + item.barcode, "sub"));

      const size = el("td", item.size_text || "-");
      if (item.size_unit === "ml" || item.size_unit === "g") {
        size.append(el("span", item.size_amount.toLocaleString("ko-KR") + item.size_unit, "sub"));
      }

      const category = el("td", item.category_label);
      category.append(el("span", STORAGE[item.storage] || item.storage, "sub"));

      const expiry = el("td", item.expiry_date || "-");
      if (item.expiry_source) expiry.append(el("span", SOURCE[item.expiry_source] || item.expiry_source, "sub"));

      const percent = Math.round(item.confidence * 100);
      row.append(
        el("td", item.line_no),
        name,
        size,
        el("td", item.quantity, "num"),
        el("td", won(item.unit_price), "num"),
        el("td", won(item.amount), "num"),
        el("td", item.discount ? "-" + won(item.discount) : "-", "num"),
        category,
        expiry,
        el("td", item.include ? "넣음" : "제외 (식품 아님)"),
        el("td", percent + "%", percent < 80 ? "num low" : "num")
      );
      return row;
    })
  );

  $("lines").replaceChildren(...data.raw_lines.map((line) => el("li", line)));
  $("json").textContent = JSON.stringify(data, null, 2);
  $("result").hidden = false;
}

const MAX_FILES = 100; // 한 번에 고를 수 있는 사진 수. 서버 한 요청은 더 적게 받아서(CHUNK_*) 이 수를 나눠 보낸다
const CHUNK_FILES = 10; // 서버 한 요청에 담는 사진 수 (서버 한도 MAX_BATCH_FILES보다 훨씬 적게)
const CHUNK_BYTES = 20 * 1024 * 1024; // 한 요청의 크기. Cloud Run은 요청 하나가 32MiB까지라서 여유를 둔다
const MAX_TRIES = 3; // 서버가 "바쁨/시간 부족"(503, 429)으로 돌려준 사진은 이만큼까지 자동으로 다시 보낸다
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// 이미 줄인 사진들을 한 요청에 담을 만큼씩 나눈다 (장수와 크기 둘 다 넘지 않게)
function chunked(items) {
  const chunks = [];
  let current = [], bytes = 0;
  for (const item of items) {
    const size = item.upload.data.size || 0;
    if (current.length && (current.length >= CHUNK_FILES || bytes + size > CHUNK_BYTES)) {
      chunks.push(current);
      current = [];
      bytes = 0;
    }
    current.push(item);
    bytes += size;
  }
  if (current.length) chunks.push(current);
  return chunks;
}
let shown = []; // 지금 화면에 있는 사진별 결과: { url, name, ok, data, message }

// 사진별 결과 중 i번째를 보여 준다. 실패한 사진은 사유만 보여 준다.
function select(i) {
  const entry = shown[i];
  $("tabRow").querySelectorAll(".tab").forEach((tab, index) => tab.setAttribute("aria-selected", String(index === i)));
  $("preview").src = entry.url;
  $("error").hidden = true;
  if (entry.ok) {
    render(entry.data);
  } else {
    $("result").hidden = true;
    showError(entry.message);
  }
}

function showResults(entries, batchSeconds, note) {
  shown = entries;
  $("layout").hidden = false;
  $("tabs").hidden = entries.length < 2;
  if (entries.length > 1) {
    const failed = entries.filter((entry) => !entry.ok).length;
    $("batchInfo").textContent = `${entries.length}장을 ${batchSeconds}초에 읽었어요` + (failed ? ` (${failed}장은 읽지 못했어요)` : "")
      + (note ? ` · ${note}` : "");
    $("tabRow").replaceChildren(
      ...entries.map((entry, index) => {
        const tab = el("button", `사진 ${index + 1}`, entry.ok ? "tab" : "tab failed");
        tab.type = "button";
        tab.setAttribute("role", "tab");
        tab.addEventListener("click", () => select(index));
        return tab;
      })
    );
  }
  select(0);
}

async function recognize(selected) {
  let files = Array.from(selected || []);
  if (!files.length) return;
  $("error").hidden = true;
  const headers = {};
  const password = $("password").value.trim();
  if (NEEDS_PASSWORD) {
    // 헤더에는 영문·숫자·기호만 실을 수 있다
    const problem = !password ? "테스트 비밀번호를 먼저 입력해 주세요."
      : /[^\x21-\x7e]/.test(password) ? "비밀번호는 영문, 숫자, 기호로만 입력해 주세요." : null;
    if (problem) {
      showError(problem);
      for (const input of inputs) input.value = "";
      $("password").focus();
      return;
    }
    headers["X-Test-Password"] = password;
  }
  let note = "";
  if (files.length > MAX_FILES) {
    note = `${files.length}장을 골랐지만 한 번에 ${MAX_FILES}장까지만 읽어요`;
    files = files.slice(0, MAX_FILES);
  }
  const many = files.length > 1;
  for (const input of inputs) input.disabled = true;
  $("result").hidden = true;
  $("tabs").hidden = true;
  $("preview").src = URL.createObjectURL(files[0]);
  $("layout").hidden = false;

  const started = Date.now();
  $("status").textContent = "사진 준비 중…";
  $("status").hidden = false;
  const uploads = [];
  for (const [index, file] of files.entries()) {
    // 한꺼번에 줄이면 사진이 많을 때 브라우저 메모리를 너무 쓴다. 한 장씩 줄인다
    if (many) $("status").textContent = `사진 준비 중… ${index + 1}/${files.length}`;
    uploads.push(await shrink(file));
  }

  let readCount = 0; // 서버가 끝낸 사진 수 (진행 표시용)
  let phase = ""; // 다시 보내는 중이면 그 안내
  const tick = () => {
    const seconds = Math.floor((Date.now() - started) / 1000);
    $("status").textContent = many
      ? `${readCount}/${files.length}장 읽음 · ${phase || "한 장씩 읽는 중"}… ${seconds}초 (다른 사람 사진을 기다리면 더 걸려요)`
      : `인식 중… ${seconds}초 (30~60초 걸릴 수 있습니다)`;
  };
  tick();
  const timer = setInterval(tick, 500);

  // 한 번 불러서 JSON을 받는다. 비밀번호가 틀리면 저장해 둔 것을 지운다.
  const post = async (url, body) => {
    const response = await fetch(url, { method: "POST", body, headers });
    const data = await response.json().catch(() => null);
    if (NEEDS_PASSWORD && response.status === 401) remember("");
    if (!response.ok) throw new Error((data && data.detail) || `서버 오류 (HTTP ${response.status})`);
    if (NEEDS_PASSWORD) remember(password);
    return data;
  };
  const seconds = () => Math.round((Date.now() - started) / 100) / 10;

  try {
    if (many) {
      const entries = new Array(files.length);
      const items = uploads.map((upload, index) => ({ index, upload }));
      for (const chunk of chunked(items)) {
        let pending = chunk;
        for (let attempt = 1; pending.length; attempt++) {
          const body = new FormData();
          pending.forEach((item) => body.append("files", item.upload.data, item.upload.name));
          const { results } = await post(`${ENDPOINT}/batch`, body);
          const retry = [];
          let wait = 0;
          for (const r of results) {
            const item = pending[r.index];
            const busy = !r.ok && (r.status_code === 503 || r.status_code === 429);
            if (busy && attempt < MAX_TRIES) {
              retry.push(item);
              wait = Math.max(wait, r.retry_after || 0);
              continue;
            }
            entries[item.index] = {
              url: URL.createObjectURL(files[item.index]),
              ok: r.ok,
              data: r.result,
              message: `사진 ${item.index + 1}: ${r.detail || "읽지 못했어요"}` + (busy ? " (잠시 뒤에 이 사진만 다시 올려 보세요)" : ""),
            };
            readCount++;
          }
          pending = retry;
          if (pending.length) {
            // 서버가 "바쁨"이나 "시간 부족"으로 돌려준 사진만 알려준 시간만큼 기다렸다가 다시 보낸다
            phase = `${pending.length}장은 서버가 바빠서 다시 보내는 중`;
            tick();
            await sleep(Math.min(15, wait) * 1000);
            phase = "";
          }
        }
      }
      showResults(entries, seconds(), note);
    } else {
      const body = new FormData();
      body.append("file", uploads[0].data, uploads[0].name);
      const data = await post(ENDPOINT, body);
      data.total_seconds = seconds();
      showResults([{ url: URL.createObjectURL(files[0]), ok: true, data }], seconds());
    }
  } catch (error) {
    // fetch 자체가 실패하면(TypeError) 서버에 닿지 못한 것이다
    showError(error instanceof TypeError ? "서버에 연결할 수 없습니다. 서버가 켜져 있는지 확인해 주세요." : error.message);
  } finally {
    clearInterval(timer);
    $("status").hidden = true;
    for (const input of inputs) {
      input.disabled = false;
      input.value = "";
    }
  }
}

for (const input of inputs) {
  input.addEventListener("change", (event) => recognize(event.target.files));
}

const drop = $("drop");
for (const type of ["dragenter", "dragover"]) {
  drop.addEventListener(type, (event) => { event.preventDefault(); drop.classList.add("over"); });
}
for (const type of ["dragleave", "drop"]) {
  drop.addEventListener(type, (event) => { event.preventDefault(); drop.classList.remove("over"); });
}
drop.addEventListener("drop", (event) => {
  if (!$("file").disabled) recognize(event.dataTransfer.files);
});
</script>
</body>
</html>
