# Run with: docker compose --env-file .env.production -f compose.production.yml up -d --build
name: foodiary

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: fridge
      POSTGRES_DB: fridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_production.py first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridge -d fridge"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    pids_limit: 256
    logging: *logging

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://fridge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/fridge?connect_timeout=5
      UPLOAD_DIR: /app/uploads
      TRUSTED_HOSTS: ${API_DOMAIN:?Set API_DOMAIN},localhost,127.0.0.1
      APP_ENV: production
      DEV_TOOLS: "false"
      AUTO_CREATE_TABLES: "false"
      OCR_ENGINE: paddle
      OCR_WARMUP: "true"
      OCR_FAIL_CLOSED: "true"
      RATE_LIMIT_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - paddle_models:/home/foodiary
    tmpfs:
      - /tmp:rw,nosuid,size=512m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()"]
      start_period: 10m
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 8g
    cpus: "2.0"
    pids_limit: 256
    stop_grace_period: 45s
    logging: *logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    logging: *logging

volumes:
  pgdata:
  uploads:
  paddle_models:
  caddy_data:
  caddy_config:
